<style>
:root{--ink:#050a14;--lagoon:#1565d8;--lagoon-d:#0f4fb0;--sun:#29b6ff;--paper:#f3f6fb;--line:#dbe4f0;--mute:#566b85;--bad:#c0392b;--ok:#1e8a5a}
*{box-sizing:border-box;margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{border:0;background:var(--lagoon);color:#fff;font-weight:600;padding:10px 18px;border-radius:999px}
.btn:hover{background:var(--lagoon-d)}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 12px;font-size:.85rem}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;width:100%;max-width:380px}
.lbox h1{font-size:1.4rem;margin-bottom:6px}.lhead{background:var(--ink);border-radius:12px;padding:16px;margin-bottom:18px;display:grid;place-items:center}.lhead img{width:210px;max-width:100%;height:auto;display:block}.lbox .f{margin:14px 0}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--ink);color:#d8e6e6;padding:18px 12px;overflow:auto;z-index:40;transition:transform .2s}
aside .brandbox{padding:6px 12px 16px}aside .brandbox img{width:176px;height:auto;display:block}aside .brandbox small{color:#8fa6c8;display:block;margin-top:2px}
aside a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500}
aside a.on,aside a:hover{background:rgba(255,255,255,.12);color:#fff}
.badge{background:var(--sun);color:var(--ink);border-radius:999px;font-size:.75rem;font-weight:700;padding:1px 8px}
.top{display:none;position:sticky;top:0;background:var(--ink);color:#fff;padding:10px 14px;align-items:center;gap:12px;z-index:30}
.top button{background:none;border:0;color:#fff;font-size:1.5rem}
main{margin-left:230px;padding:26px;max-width:1300px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd h1{font-size:1.7rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card small{color:var(--mute);display:block}.card b{font:800 1.6rem "Bricolage Grotesque"}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h3{margin-bottom:12px;font-size:1.1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.act{white-space:nowrap}
.st{padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:#eef2f1}
.st.pendiente{background:#fff1d0}.st.asignada{background:#dbeafe}.st.atendida{background:#d7f3e5}.st.cancelada{background:#fde2de}
.empty{padding:26px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar .cols{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.bar i{display:block;width:100%;max-width:26px;background:var(--lagoon);border-radius:4px 4px 0 0;min-height:2px}
.bar i.b2{background:var(--sun)}
.bar span{font-size:.68rem;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.leg{font-size:.82rem;color:var(--mute);margin-top:8px}.leg u{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--lagoon);margin:0 4px 0 10px;text-decoration:none}.leg u.b2{background:var(--sun)}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,30,36,.55)}
dialog form{padding:22px;display:flex;flex-direction:column;max-height:92vh;overflow:auto}
dialog h2{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{margin-bottom:12px}.full{grid-column:1/-1}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgs div{position:relative}.imgs img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imgs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;line-height:1}
.ffrow{display:grid;grid-template-columns:2fr 1.2fr 2fr auto auto;gap:6px;margin-bottom:6px;align-items:center}
.info{background:var(--paper);border-radius:10px;padding:12px;font-size:.9rem}.info div{margin-bottom:3px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools>*{max-width:260px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;display:none}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}.top{display:flex}main{margin-left:0;padding:16px}.two,.g2{grid-template-columns:1fr}.ffrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login"><form class="lbox" id="lf">
  <div class="lhead"><img src="../assets/img/logo-full.png" alt="GOVEX COMPANY" width="900" height="489"></div>
  <h1>Panel administrativo</h1><p style="color:var(--mute)">Acceso exclusivo del propietario.</p>
  <div class="f"><label for="em">Correo</label><input id="em" type="email" required autocomplete="username"></div>
  <div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" required autocomplete="current-password"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const $=s=>document.querySelector(s);
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}kids.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c)});return e};
const cfg=window.APP_CONFIG||{};
if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('TU-PROYECTO')){document.body.replaceChildren(h('p',{style:'padding:30px'},'Configura public/config.js con los datos de Supabase.'));throw 0}
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const fdt=s=>s?new Date(s).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
const fail=(e,m)=>{console.error(e);toast(m||'Error: '+(e.message||e))};

/* ---------- Imágenes ---------- */
async function uploadImg(file,folder){
  const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const path=folder+'/'+crypto.randomUUID()+'.jpg';
  const {error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});
  if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ---------- Formularios genéricos ---------- */
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'campo';
function field(f,val){
  let node,get=()=>undefined;const id='f_'+f.k;
  const wrap=(inner)=>h('div',{class:'f'+(f.full||['textarea','image','images','formfields','info'].includes(f.type)?' full':'')},f.label&&f.type!=='bool'?h('label',{for:id},f.label+(f.req?' *':'')):null,inner);
  const t=f.type||'text';
  if(t==='info')return{node:wrap(f.node),get};
  if(['text','number','date','time','email','tel'].includes(t)){
    const i=h('input',{id,type:t,step:t==='number'?'any':null,required:f.req,value:val??''});
    node=i;get=()=>{const v=i.value.trim();return t==='number'?(v===''?null:Number(v)):(v||null)};
  }else if(t==='textarea'){const i=h('textarea',{id,rows:3,required:f.req});i.value=val??'';node=i;get=()=>i.value.trim()||null}
  else if(t==='select'){const i=h('select',{id,required:f.req},f.req?null:h('option',{value:''},'—'),(f.options||[]).map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return h('option',{value:v},l)}));i.value=val??'';node=i;get=()=>i.value||null}
  else if(t==='ref'){const i=h('select',{id,required:f.req},h('option',{value:''},'Cargando…'));node=i;get=()=>i.value||null;
    sb.from(f.table).select('*').then(({data})=>{i.replaceChildren(h('option',{value:''},'—'),...(data||[]).filter(r=>!f.filter||f.filter(r)).map(r=>h('option',{value:r.id},f.label_fn(r))));i.value=val??''})}
  else if(t==='bool'){const i=h('input',{id,type:'checkbox',style:'width:auto'});i.checked=val??f.def??false;node=h('label',{style:'display:flex;gap:8px;align-items:center;margin-top:24px'},i,f.label);get=()=>i.checked}
  else if(t==='tags'){const i=h('input',{id,placeholder:'separa con comas',value:(val||[]).join(', ')});node=i;get=()=>i.value.split(',').map(x=>x.trim()).filter(Boolean)}
  else if(t==='image'||t==='images'){
    let list=t==='image'?(val?[val]:[]):[...(val||[])];const box=h('div',{class:'imgs'});
    const draw=()=>box.replaceChildren(...list.map((u,ix)=>h('div',{},h('img',{src:u,alt:''}),h('button',{type:'button','aria-label':'Quitar',onclick:()=>{list.splice(ix,1);draw()}},'×'))));draw();
    const fi=h('input',{type:'file',accept:'image/*',multiple:t==='images',onchange:async()=>{
      for(const file of fi.files){try{toast('Subiendo imagen…');list=t==='image'?[await uploadImg(file,f.folder||'img')]:[...list,await uploadImg(file,f.folder||'img')];draw()}catch(e){fail(e,'No se pudo subir la imagen')}}fi.value='';toast('Imagen lista')}});
    node=h('div',{},fi,box);get=()=>t==='image'?(list[0]||null):list}
  else if(t==='formfields'){
    let rows=(val||[]).map(r=>({...r}));const box=h('div');
    const draw=()=>{box.replaceChildren(...rows.map((r,ix)=>h('div',{class:'ffrow'},
      h('input',{placeholder:'Pregunta (ej. Lugar de origen)',value:r.label||'',oninput:e=>r.label=e.target.value}),
      (()=>{const s=h('select',{onchange:e=>{r.type=e.target.value;draw()}},['text:Texto','number:Número','date:Fecha','time:Hora','select:Lista','textarea:Texto largo'].map(x=>{const[v,l]=x.split(':');return h('option',{value:v},l)}));s.value=r.type||'text';return s})(),
      r.type==='select'?h('input',{placeholder:'Opciones separadas por coma',value:(r.options||[]).join(', '),oninput:e=>r.options=e.target.value.split(',').map(x=>x.trim()).filter(Boolean)}):h('span'),
      h('label',{style:'margin:0;font-weight:400'},h('input',{type:'checkbox',style:'width:auto',checked:!!r.required,onchange:e=>r.required=e.target.checked}),' Obligatorio'),
      h('button',{type:'button',class:'btn sec sm',onclick:()=>{rows.splice(ix,1);draw()}},'Quitar'))),
      h('button',{type:'button',class:'btn sec sm',onclick:()=>{rows.push({label:'',type:'text',required:true});draw()}},'+ Agregar pregunta'))};
    draw();node=box;get=()=>rows.filter(r=>r.label&&r.label.trim()).map(r=>({key:r.key||slug(r.label),label:r.label.trim(),type:r.type||'text',required:!!r.required,...(r.type==='select'?{options:r.options||[]}:{})}))}
  return{node:wrap(node),get};
}
function openForm({title,fields,values={},onSave,del}){
  const dlg=h('dialog');const fs=fields.map(f=>({f,...field(f,values[f.k])}));
  const err=h('div',{class:'err',role:'alert'});
  const form=h('form',{method:'dialog'},h('h2',{},title),h('div',{class:'g2'},fs.map(x=>x.node)),err,
    h('div',{class:'row'},del?h('button',{type:'button',class:'btn bad',onclick:async()=>{if(!confirm('¿Eliminar definitivamente?'))return;try{await del();dlg.close();dlg.remove()}catch(e){err.textContent=e.message}}},'Eliminar'):null,
    h('button',{type:'button',class:'btn sec',onclick:()=>{dlg.close();dlg.remove()}},'Cancelar'),h('button',{class:'btn'},'Guardar')));
  form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const v={};fs.forEach(x=>{if(x.f.k)v[x.f.k]=x.get()});
    const btn=form.querySelector('.row .btn:last-child');btn.disabled=true;
    try{await onSave(v);dlg.close();dlg.remove();toast('Guardado')}catch(ex){err.textContent=ex.message||'No se pudo guardar'}btn.disabled=false});
  dlg.append(form);document.body.append(dlg);dlg.showModal();
}

/* ---------- CRUD genérico ---------- */
async function crud(c){
  const main=$('#main');
  const {data,error}=await sb.from(c.table).select(c.select||'*').order(c.order||'created_at',{ascending:!!c.asc});
  if(error)return main.replaceChildren(h('div',{class:'err'},'No se pudo cargar: '+error.message));
  const q=h('input',{placeholder:'Buscar…',type:'search'});
  const body=h('div',{class:'tw'});
  const draw=()=>{const t=q.value.toLowerCase();const rows=data.filter(r=>!t||c.cols.map(x=>String(x.f(r)??'')).join(' ').toLowerCase().includes(t));
    body.replaceChildren(rows.length?h('table',{},h('thead',{},h('tr',{},c.cols.map(x=>h('th',{},x.l)),h('th',{}))),
      h('tbody',{},rows.map(r=>h('tr',{},c.cols.map(x=>h('td',{},x.f(r)??'')),h('td',{class:'act'},h('button',{class:'btn sec sm',onclick:()=>edit(r)},'Editar'))))))
      :h('div',{class:'empty'},c.empty||'Aún no hay registros. Usa el botón "Nuevo".'))};
  const edit=r=>openForm({title:(r?'Editar ':'Nuevo ')+c.one,fields:c.fields,values:r||c.defaults||{},
    onSave:async v=>{if(c.before)await c.before(v,r);const res=r?await sb.from(c.table).update(v).eq('id',r.id):await sb.from(c.table).insert(v);if(res.error)throw res.error;load(c.route)},
    del:r?async()=>{const {error}=await sb.from(c.table).delete().eq('id',r.id);if(error)throw error;load(c.route)}:null});
  q.addEventListener('input',draw);draw();
  main.replaceChildren(h('div',{class:'hd'},h('h1',{},c.title),h('button',{class:'btn',onclick:()=>edit(null)},'+ Nuevo')),h('div',{class:'tools'},q),h('div',{class:'panel'},body));
}
const yn=b=>b?'Sí':'No';
const catRef={k:'category_id',label:'Categoría',type:'ref',table:'categories',label_fn:r=>r.name,req:true};
const CFG={
 clientes:{route:'clientes',table:'clients',title:'Clientes',one:'cliente',cols:[{l:'Nombre',f:r=>r.name},{l:'Teléfono',f:r=>r.phone},{l:'Correo',f:r=>r.email},{l:'Alta',f:r=>fdt(r.created_at)}],
  fields:[{k:'name',label:'Nombre',req:true},{k:'phone',label:'Teléfono',type:'tel'},{k:'email',label:'Correo',type:'email'},{k:'notes',label:'Notas',type:'textarea'}]},
 trabajadores:{route:'trabajadores',table:'workers',title:'Trabajadores',one:'trabajador',defaults:{available:true,active:true},
  cols:[{l:'Nombre',f:r=>r.full_name},{l:'Teléfono',f:r=>r.phone},{l:'Especialidades',f:r=>(r.specialties||[]).join(', ')},{l:'Zonas',f:r=>(r.zones||[]).join(', ')},{l:'Tarifa',f:r=>r.rate!=null?money(r.rate)+' '+(r.rate_unit||''):''},{l:'Disponible',f:r=>yn(r.available)},{l:'Activo',f:r=>yn(r.active)}],
  fields:[{k:'full_name',label:'Nombre completo',req:true},{k:'phone',label:'Teléfono de contacto',type:'tel'},{k:'specialties',label:'Especialidades',type:'tags'},{k:'zones',label:'Zonas de trabajo',type:'tags'},{k:'experience',label:'Experiencia',type:'textarea'},
   {k:'rate',label:'Tarifa (S/)',type:'number'},{k:'rate_unit',label:'Tarifa por',type:'select',options:['por servicio','por hora','por día','por km']},{k:'available',label:'Disponible ahora',type:'bool'},{k:'active',label:'Activo (desmarca para desactivar)',type:'bool'},{k:'notes',label:'Notas',type:'textarea'}]},
 vehiculos:{route:'vehiculos',table:'vehicles',title:'Vehículos',one:'vehículo',select:'*, workers(full_name)',defaults:{status:'disponible'},
  cols:[{l:'Tipo',f:r=>r.vehicle_type},{l:'Marca / modelo',f:r=>[r.brand,r.model,r.year].filter(Boolean).join(' ')},{l:'Placa',f:r=>r.plate},{l:'Capacidad',f:r=>r.capacity},{l:'Conductor',f:r=>r.workers?.full_name},{l:'Zona',f:r=>r.zone},{l:'Estado',f:r=>r.status},{l:'Fotos',f:r=>(r.photos||[]).length}],
  fields:[{k:'vehicle_type',label:'Tipo de vehículo',type:'select',options:['Auto','Camioneta','Minivan','Camión','Moto carga','Bus'],req:true},{k:'brand',label:'Marca'},{k:'model',label:'Modelo'},{k:'year',label:'Año',type:'number'},{k:'plate',label:'Placa'},{k:'capacity',label:'Capacidad'},
   {k:'driver_id',label:'Conductor responsable',type:'ref',table:'workers',label_fn:r=>r.full_name},{k:'contact_phone',label:'Teléfono de contacto',type:'tel'},{k:'zone',label:'Zona de disponibilidad'},{k:'status',label:'Estado',type:'select',options:['disponible','en servicio','mantenimiento','inactivo'],req:true},{k:'photos',label:'Fotografías',type:'images',folder:'vehiculos'}]},
 categorias:{route:'categorias',table:'categories',title:'Categorías',one:'categoría',order:'sort',asc:true,defaults:{active:true,sort:0},
  before:v=>{v.slug=slug(v.name)},
  cols:[{l:'Orden',f:r=>r.sort},{l:'Nombre',f:r=>r.name},{l:'Preguntas del formulario',f:r=>(r.form_fields||[]).length},{l:'Imagen',f:r=>r.image_url?'Sí':'Falta'},{l:'Visible',f:r=>yn(r.active)}],
  fields:[{k:'name',label:'Nombre',req:true},{k:'sort',label:'Orden',type:'number'},{k:'description',label:'Descripción',type:'textarea'},{k:'image_url',label:'Imagen de la categoría',type:'image',folder:'categorias'},{k:'active',label:'Visible en la página',type:'bool'},{k:'form_fields',label:'Formulario de solicitud (preguntas al cliente)',type:'formfields'}]},

/* ---------- Solicitudes ---------- */
async function ensureClient(r){
  if(r.client_id)return r.client_id;
  const {data}=await sb.from('clients').select('id').eq('phone',r.customer_phone).limit(1);
  if(data&&data[0])return data[0].id;
  const c=await sb.from('clients').insert({name:r.customer_name,phone:r.customer_phone,email:r.customer_email}).select('id').single();
  return c.data?.id||null;
}

    const csv=()=>{const rows=[['Fecha','Tipo','Monto','Concepto','Método','Trabajador','Solicitud'],...data.map(x=>[x.occurred_on,x.kind,x.amount,x.concept||'',x.method||'',x.workers?.full_name||'',x.requests?.code||''])];

      h('div',{class:'panel'},h('h3',{},'Evolución'),bars(rep.map(r=>({l:r.l.slice(gs.value==='month'?2:5),a:r.i,b:r.w+r.g})),true)),
      h('div',{class:'panel'},h('h3',{},'Reporte por período'),rep.length?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},['Período','Ingresos','Pagos trabajadores','Gastos','Ganancia'].map(x=>h('th',{},x)))),h('tbody',{},rep.map(r=>h('tr',{},h('td',{},r.l),h('td',{},money(r.i)),h('td',{},money(r.w)),h('td',{},money(r.g)),h('td',{},h('b',{},money(r.i-r.w-r.g)))))))):h('div',{class:'empty'},'Sin movimientos en este rango.')),
      h('div',{class:'panel'},h('h3',{},'Ganancia real por servicio'),Object.keys(sv).length?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},['Servicio','Ingresos','Costos asociados','Ganancia'].map(x=>h('th',{},x)))),h('tbody',{},Object.entries(sv).map(([n,o])=>h('tr',{},h('td',{},n),h('td',{},money(o.i)),h('td',{},money(o.c)),h('td',{},h('b',{},money(o.i-o.c)))))))):h('div',{class:'empty'},'Registra cobros y pagos vinculados a solicitudes para ver la ganancia por servicio.')),
      h('div',{class:'panel'},h('div',{class:'hd'},h('h3',{},'Historial de movimientos'),h('button',{class:'btn sec sm',onclick:csv},'Descargar CSV')),
        data.length?h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},['Fecha','Tipo','Monto','Concepto','Trabajador','Solicitud',''].map(x=>h('th',{},x)))),h('tbody',{},data.map(x=>h('tr',{},h('td',{},x.occurred_on),h('td',{},x.kind.replace('_',' ')),h('td',{},money(x.amount)),h('td',{},x.concept||''),h('td',{},x.workers?.full_name||''),h('td',{},x.requests?.code||''),

/* ---------- Sesión ---------- */
async function enter(session){
  const {data}=await sb.from('admins').select('user_id').eq('user_id',session.user.id);
  if(!data||!data.length){await sb.auth.signOut();$('#lerr').textContent='Esta cuenta no tiene permiso de administrador.';return false}
  $('#login').style.display='none';$('#app').style.display='block';
  await badge();load();
  sb.channel('adm_req').on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{badge();if(p.eventType==='INSERT')toast('Nueva solicitud de '+p.new.customer_name);if(['dashboard','solicitudes'].includes(cur)&&!document.querySelector('dialog[open]'))load(cur)}).subscribe();
  return true;
}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#lerr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)return $('#lerr').textContent='Correo o contraseña incorrectos.';enter(data.session)});
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session)});
